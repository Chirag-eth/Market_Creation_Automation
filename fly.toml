app = 'pred-mo'
primary_region = 'fra'

[build]

[env]
  APP_ENV = 'mainnet'
  PORT = '8080'
  NODE_ENV = 'production'
  AUTH_ORG_DOMAIN = 'pred.app'
  PUBLIC_BASE_URL = 'https://pred-mo.fly.dev'
  TRUST_PROXY = '1'
  SPORTSDATA_SCHEDULE_BASE_URL = 'https://api.sportsdata.io/v4/soccer/scores/json/Schedule'
  SPORTSDATA_SCHEDULE_SEASON = '2026'
  LEAGUES_CSV_PATH = 'catalog/leagues-main.csv'
  TEAMS_CSV_PATH = 'catalog/teams-main.csv'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
