name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax Checks
        run: |
          node --check src/ui.js
          node --check src/parser.js
          node --check src/typeRefs.js
          node --check src/markets.js
          node --check src/validation.js
          node --check server.js

      - name: Run Tests
        run: node --test tests/*.test.mjs
